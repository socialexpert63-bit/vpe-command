<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>VPE Command – Project Execution & Delivery Intelligence Platform</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F7FB;--card:#fff;--bd:#E2E8F0;--tx:#101C2C;--mu:#64748B;--nav:#101C2C;--sl:#1E293B;--bl:#2563EB;--cy:#06B6D4;--te:#14B8A6;--rd:#DC2626;--am:#D97706;--gr:#16A34A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B1220;--card:#151F32;--bd:#26344D;--tx:#E6EDF7;--mu:#94A3B8;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
.top{position:sticky;top:0;z-index:5;background:var(--nav);color:#fff;display:flex;gap:10px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.logo{font-weight:700;letter-spacing:.3px}.logo b{color:var(--cy)}.top select,.top input{background:var(--sl);color:#fff;border:1px solid #334155;border-radius:8px;padding:7px 10px;font:inherit}
.top input{flex:1;min-width:120px;max-width:320px}.sp{flex:1}.bell{cursor:pointer;position:relative;background:var(--sl);border:1px solid #334155;border-radius:8px;color:#fff;padding:7px 10px}
.pop{position:absolute;right:8px;top:54px;width:290px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:12px;box-shadow:0 12px 30px #0003;display:none;z-index:9}
.wrap{display:flex;min-height:calc(100vh - 56px)}nav{width:230px;background:var(--nav);padding:10px;flex:none}
nav a{display:block;color:#CBD5E1;text-decoration:none;padding:9px 12px;border-radius:8px;margin-bottom:2px;transition:.2s}nav a:hover{background:var(--sl);color:#fff}nav a.on{background:var(--bl);color:#fff}
main{flex:1;padding:20px;min-width:0;animation:fi .35s}@keyframes fi{from{opacity:0;transform:translateY(8px)}}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mu);margin-bottom:16px}h3{margin:0 0 10px;font-size:15px}
.grid{display:grid;gap:14px}.k6{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;transition:.2s}.card.h:hover{transform:translateY(-3px);box-shadow:0 8px 22px #2563eb22;cursor:pointer}
.kl{color:var(--mu);font-size:12px}.kv{font-size:26px;font-weight:700;margin:4px 0}.up{color:var(--gr);font-size:12px}.dn{color:var(--rd);font-size:12px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-size:12px;cursor:pointer}.sc{overflow-x:auto}
.pill{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;display:inline-block}.ok{background:#16A34A22;color:var(--gr)}.wa{background:#D9770622;color:var(--am)}.bad{background:#DC262622;color:var(--rd)}.nu{background:#2563EB22;color:var(--bl)}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--bl),var(--cy));width:0;transition:width 1s}
button,.btn{background:var(--bl);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}button.s{background:var(--bd);color:var(--tx)}select,input[type=text],input[type=number]{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.gantt{position:relative;min-width:100%}.gr{display:flex;height:30px;border-bottom:1px solid var(--bd)}.gl{width:200px;flex:none;padding:6px 8px;position:sticky;left:0;background:var(--card);z-index:2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gb{position:relative;flex:none;height:30px}.gb .b{position:absolute;top:8px;height:14px;border-radius:4px;background:#2563EB55}.gb .b i{display:block;height:100%;background:var(--bl);border-radius:4px}.gb .b.c{background:#DC262655}.gb .b.c i{background:var(--rd)}.gb .bl{position:absolute;top:24px;height:4px;background:var(--mu);opacity:.6;border-radius:2px}
.kan{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:10px;overflow-x:auto}.col{background:var(--bg);border-radius:10px;padding:8px;min-height:140px}.t{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px;margin-top:8px;font-size:13px}
.heat{display:grid;grid-template-columns:repeat(5,52px);gap:4px}.hc{height:52px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;cursor:pointer}
.chat{height:300px;overflow:auto;background:var(--bg);border-radius:10px;padding:10px}.m{margin:8px 0;max-width:88%;padding:9px 12px;border-radius:10px;background:var(--card);border:1px solid var(--bd)}.m.u{margin-left:auto;background:var(--bl);color:#fff}
.toast{position:fixed;bottom:20px;right:20px;background:var(--nav);color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:20}.note{font-size:12px;color:var(--mu)}
.exp{display:none;margin-top:10px;font-size:13px;color:var(--mu)}.open .exp{display:block}
@media(max-width:800px){nav{position:fixed;bottom:0;left:0;right:0;width:auto;display:flex;overflow-x:auto;z-index:6;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}nav a{white-space:nowrap;margin:0 2px}main{padding:14px 12px 80px}.wrap{display:block}}
@media print{.top,nav,.noprint{display:none}}
</style></head><body>
<div class="top"><div class="logo">VPE <b>Command</b></div><select id="org"><option>Vision Planning & Execution</option><option>Northgate Delivery Group</option></select><select id="prj"><option>All projects</option><option>Project Alpha</option><option>Project Orion</option><option>Project Nova</option><option>Project Horizon</option></select><input id="gs" placeholder="Search projects, risks, packages…"><span class="sp"></span><select><option>Q4 2026</option><option>Last 30 days</option><option>FY 2026</option></select><button class="bell" id="bell">🔔 4</button><span title="Help center" style="cursor:pointer" id="help">?</span><span>RC</span></div>
<div class="pop" id="pop"><b>Notifications</b><div class="note" style="margin:6px 0">Demonstration alerts</div>⚠ Orion: steel erection float down to 4 days<br><br>✔ Nova: validation milestone completed<br><br>↑ Horizon: budget revision submitted<br><br>★ Alpha: MEP package approved</div>
<div class="wrap"><nav id="nav"></nav><main id="m"></main></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const NAV=[["overview","Executive Overview"],["portfolio","Project Portfolio"],["execution","Project Execution"],["schedule","Schedule & Planning"],["cost","Cost & Budget Control"],["risk","Risk & Issue Management"],["quality","Quality & Safety"],["procurement","Procurement & Contracts"],["field","Field Progress"],["resources","Resource Management"],["ai","AI Project Assistant"],["reports","Reports & Analytics"],["settings","Settings"]];
const P=[["PRJ-101","Project Alpha","Commercial Development","M. Hargrove",12.4,64,"On Track","Medium","Level 6 slab pour – 12 Dec"],["PRJ-102","Project Orion","Industrial Facility","D. Okafor",18.2,48,"At Risk","High","Steel erection complete – 28 Jan"],["PRJ-103","Project Nova","Pharmaceutical Expansion","S. Lindqvist",9.6,71,"On Track","Low","Cleanroom validation – 15 Dec"],["PRJ-104","Project Horizon","Infrastructure Upgrade","A. Rahman",8.4,39,"Delayed","High","Bridge deck pour – 10 Feb"],["PRJ-105","Project Meridian","Capital Projects","K. Brandt",5.1,92,"Completed","Low","Handover – done"],["PRJ-106","Project Atlas","Construction Projects","L. Moreau",6.3,22,"Critical","High","Foundation redesign – 05 Dec"]];
const cls=s=>/On Track|Completed|Passed|Approved|Closed|Awarded|Low|Verified|Active/.test(s)?"ok":/Risk|Medium|Review|Pending|RFQ|Open/.test(s)?"wa":/Delay|Critical|High|Failed|Rejected|Overdue/.test(s)?"bad":"nu";
const pill=s=>`<span class="pill ${cls(s)}">${s}</span>`;
const spark=a=>{const mx=Math.max(...a),mn=Math.min(...a);return`<svg width="100%" height="28" viewBox="0 0 100 28" preserveAspectRatio="none"><polyline fill="none" stroke="#06B6D4" stroke-width="2" points="${a.map((v,i)=>(i*100/(a.length-1))+","+(26-(v-mn)/(mx-mn||1)*24)).join(" ")}"/></svg>`};
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display="none",2200)}
function kpis(a){return`<div class="grid k6">${a.map(([l,v,c,s])=>`<div class="card h"><div class="kl">${l}</div><div class="kv" data-v="${v}">${v}</div><div class="${/^-/.test(c||"")?"dn":"up"}">${c||""}</div>${s?spark(s):""}</div>`).join("")}</div>`}
function count(){document.querySelectorAll(".kv").forEach(e=>{const v=e.dataset.v,m=v.match(/^([^\d]*)([\d.]+)(.*)$/);if(!m)return;const to=parseFloat(m[2]),d=(m[2].split(".")[1]||"").length,t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/900);e.textContent=m[1]+(to*p).toFixed(d)+m[3];if(p<1)requestAnimationFrame(f)})(t0)});setTimeout(()=>document.querySelectorAll(".bar i").forEach(i=>i.style.width=i.dataset.w+"%"),30)}
const bar=p=>`<div class="bar"><i data-w="${p}"></i></div>`;
function table(cols,rows,id){return`<div class="card sc"><table id="${id||""}"><thead><tr>${cols.map((c,i)=>`<th data-i="${i}">${c} ↕</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${/^(On Track|At Risk|Delayed|Critical|Completed|Passed|Failed|Approved|Pending|Open|Closed|Awarded|RFQ Issued|Under Review|Active|Low|Medium|High|Verified|Rejected)$/.test(c)?pill(c):c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}
const V={};
V.overview=()=>`<h1>Good morning, Richard</h1><div class="sub">Here is your project delivery overview. · Reporting period: Q4 2026 · <span class="note">Concept prototype – fictional demonstration data</span></div>
${kpis([["Active Projects","18","+2 this quarter",[12,13,14,14,16,18]],["Projects On Schedule","82%","+3.1%",[74,76,78,77,80,82]],["Portfolio Budget","$48.6M","+$1.8M",[40,42,44,45,47,48.6]],["Budget Utilization","76%","+4%",[55,60,64,68,72,76]],["Critical Issues","12","-3 vs last month",[20,18,17,15,14,12]],["Delivery Performance","89%","+1.4%",[82,84,85,87,88,89]]])}
<div class="grid g2" style="margin-top:14px"><div class="card"><h3>Planned vs actual progress (portfolio %)</h3>${line([[8,22,35,48,60,71,80],[7,20,32,43,55,66,74]],["Planned","Actual"])}</div>
<div class="card"><h3>Project health distribution</h3>${[["On Track",9],["At Risk",5],["Delayed",2],["Critical",1],["Completed",1]].map(([n,c])=>`<div style="margin:8px 0">${pill(n)} <b>${c}</b>${bar(c*5.5)}</div>`).join("")}<h3 style="margin-top:14px">Monthly milestone completion</h3><div style="display:flex;gap:6px;align-items:end;height:70px">${[6,8,5,9,11,7].map(v=>`<div style="flex:1;background:var(--cy);height:${v*6}px;border-radius:4px" title="${v} milestones"></div>`).join("")}</div></div></div>
<h3 style="margin:18px 0 8px">Project portfolio <span class="note">(click a card to expand)</span></h3><div class="grid g2">${P.slice(0,4).map(p=>`<div class="card h" onclick="this.classList.toggle('open')"><b>${p[1]}</b> – ${p[2]} <span style="float:right">${pill(p[6])}</span><div class="note">PM: ${p[3]} · Budget $${p[4]}M · Risk ${p[7]}</div><div style="margin:8px 0">${bar(p[5])}<span class="note">${p[5]}% complete</span></div><div class="exp">Next milestone: ${p[8]}<br>Schedule status: ${p[6]}. Open the Schedule module for the baseline comparison.</div></div>`).join("")}</div>
<div class="grid g2" style="margin-top:14px"><div class="card"><h3>⚑ Executive attention</h3>${["Atlas: foundation redesign adds 5 weeks to critical path","Orion: structural steel delivery slipped 9 days","Horizon: $0.7M unapproved change order exposure","Nova: validation protocol awaiting regulator sign-off","Alpha: façade contractor claim under review"].map((t,i)=>`<div style="padding:7px 0;border-bottom:1px solid var(--bd)"><b>${i+1}.</b> ${t}</div>`).join("")}</div>
<div class="card"><h3>Recent activity</h3>${["Milestone completed – Nova cleanroom fit-out","Budget revision submitted – Horizon","Risk escalated – Atlas ground conditions","Procurement package approved – Alpha MEP","Schedule baseline updated – Orion Rev C"].map(t=>`<div style="padding:7px 0;border-bottom:1px solid var(--bd)">${t}</div>`).join("")}</div></div>`;
function line(s,n){const w=420,h=170,c=["#2563EB","#14B8A6"];return`<svg viewBox="0 0 ${w} ${h}" width="100%">${s.map((a,k)=>`<polyline fill="none" stroke="${c[k]}" stroke-width="3" points="${a.map((v,i)=>(20+i*(w-40)/(a.length-1))+","+(h-20-v*1.6)).join(" ")}"/>`).join("")}<text x="20" y="14" fill="#2563EB" font-size="11">■ ${n[0]}</text><text x="100" y="14" fill="#14B8A6" font-size="11">■ ${n[1]}</text></svg>`}
V.portfolio=()=>{const rows=P.map(p=>[p[0],p[1],"Client "+p[0].slice(-1),p[2],p[3],"Mar 2026","Jun 2027","$"+p[4]+"M","$"+(p[4]*p[5]/100*1.03).toFixed(1)+"M",p[5]+"%",p[6]]);return`<h1>Project Portfolio</h1><div class="sub">Click any row to open the project workspace</div>${kpis([["Total Projects","18"],["Active","15"],["Completed","3"],["At Risk","5"],["Portfolio Value","$48.6M"],["Completion Rate","61%"]])}<div class="row" style="margin-top:14px"><input type="text" id="q" placeholder="Filter projects…"><select id="fc"><option value="">All categories</option>${[...new Set(P.map(p=>p[2]))].map(c=>`<option>${c}</option>`).join("")}</select><button id="add">+ New project</button></div>${table(["ID","Project","Client","Type","Manager","Start","Target","Budget","Actual","Progress","Health"],rows,"pt")}<div class="card" style="margin-top:14px"><h3>Compare: Orion vs Horizon</h3><div class="grid g2">${["Orion","Horizon"].map((n,i)=>`<div><b>Project ${n}</b>${["Schedule performance","Budget performance","Progress"].map((l,j)=>`<div class="note" style="margin-top:6px">${l}</div>${bar([[92,81],[86,78],[48,39]][j][i])}`).join("")}</div>`).join("")}</div></div>`};
const T0=[["Project Horizon – Bridge & Approaches",0,44,0,40,52,0,-1],["Design & Approvals",0,8,0,8,100,0,-1],["Site Mobilisation",8,4,8,4,100,1,1],["Piling & Foundations",12,10,12,9,85,1,2],["Pier Construction",22,9,21,8,45,1,3],["Girder Delivery",24,6,22,6,30,0,3],["Deck Pour",31,8,29,7,0,1,4],["Barrier & Surfacing",39,5,36,5,0,1,6],["Handover Milestone ◆",44,0,40,0,0,1,7]];
let T=JSON.parse(JSON.stringify(T0)),Z=20;
function gantt(){const W=52*Z;let h=`<div class="gr"><div class="gl"><b>Activity</b></div><div class="gb" style="width:${W}px">${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"].map((m,i)=>`<span style="position:absolute;left:${i*4.33*Z}px;top:6px;font-size:11px;color:var(--mu)">${m}</span>`).join("")}</div></div>`;T.forEach((t,i)=>{h+=`<div class="gr"><div class="gl" title="${t[0]}">${t[0]}</div><div class="gb" style="width:${W}px">${t[2]?`<div class="b ${t[6]?"c":""}" style="left:${t[1]*Z}px;width:${t[2]*Z}px"><i style="width:${t[5]}%"></i></div><div class="bl" style="left:${t[3]*Z}px;width:${t[4]*Z}px"></div>`:`<div style="position:absolute;left:${t[1]*Z-7}px;top:6px;color:var(--rd);font-size:18px">◆</div>`}</div></div>`});const d=T.map((t,j)=>{const p=T[t[7]];if(!p)return"";const x1=200+(p[1]+p[2])*Z,y1=45+t[7]*30,y2=45+j*30;return`<path d="M${x1} ${y1}H${x1+6}V${y2}H${200+t[1]*Z}" fill="none" stroke="#94A3B8" stroke-width="1.5"/>`}).join("");return`<div class="sc" style="max-height:340px;overflow:auto"><div class="gantt" style="width:${W+200}px">${h}<svg style="position:absolute;left:0;top:0;pointer-events:none" width="${W+200}" height="${30+T.length*30}">${d}</svg></div></div>`}
V.schedule=()=>`<h1>Schedule & Planning</h1><div class="sub">Project Horizon · baseline vs current forecast · critical path in red <span class="note">(grey line = baseline)</span></div>${kpis([["Planned Progress","46%"],["Actual Progress","39%","-7 pts"],["Schedule Variance","-4.0 wks","-1 wk"],["Critical Activities","6"],["Delayed Activities","3"],["Upcoming Milestones","4"]])}<div class="row" style="margin-top:14px"><b>Zoom</b>${[["Quarter",9],["Month",20],["Week",40]].map(([n,z])=>`<button class="s zm" data-z="${z}">${n}</button>`).join("")}<span class="sp"></span><select id="ta">${T.map((t,i)=>t[2]?`<option value="${i}">${t[0]}</option>`:"").join("")}</select><label>Progress <input type="number" id="tp" min="0" max="100" value="50" style="width:64px">%</label><button id="up">Update progress</button><button id="sl" class="s">Slip +1 week</button><button id="rs" class="s">Reset</button></div><div class="card" id="g">${gantt()}</div><div class="card" style="margin-top:14px"><h3>Forecast finish</h3>Handover forecast: week ${T[8][1]} vs baseline week ${T[8][3]} → <b class="${T[8][1]>T[8][3]?"dn":"up"}">${T[8][1]-T[8][3]} weeks slippage</b>. Critical path: Mobilisation → Piling → Piers → Deck Pour → Surfacing → Handover.</div>`;
const R=[["R-01","Ground conditions at Atlas foundation",4,5,"L. Moreau","Mitigating"],["R-02","Structural steel delivery delay",4,4,"D. Okafor","Open"],["R-03","Regulator approval lead time",3,5,"S. Lindqvist","Open"],["R-04","Façade contractor claim",3,3,"M. Hargrove","Under Review"],["R-05","Currency exposure on imported plant",2,4,"K. Brandt","Open"],["R-06","Weather window for deck pour",4,3,"A. Rahman","Mitigating"],["R-07","Skilled labour shortage",3,4,"A. Rahman","Open"]];
V.risk=()=>`<h1>Risk & Issue Management</h1><div class="sub">Probability × impact matrix · click a cell, then a risk for root cause and mitigation</div>${kpis([["Total Risks","64"],["High-Priority","11"],["Open Issues","27"],["Critical Issues","12"],["Mitigated","21"],["Pending Decisions","8"]])}<div class="grid g2" style="margin-top:14px"><div class="card"><h3>5×5 heatmap</h3><div class="heat">${[5,4,3,2,1].flatMap(p=>[1,2,3,4,5].map(i=>{const s=p*i;return`<div class="hc" data-p="${p}" data-i="${i}" style="background:${s>=15?"#DC2626":s>=8?"#D97706":"#16A34A"}">${R.filter(r=>r[2]==p&&r[3]==i).length||""}</div>`})).join("")}</div><div class="note" style="margin-top:6px">Rows: probability 5→1 · Columns: impact 1→5</div></div><div class="card"><h3 id="rt">All risks</h3><div id="rl">${rl(R)}</div></div></div><h3 style="margin:16px 0 8px">Issue workflow</h3><div class="kan">${["Reported","Under Investigation","Action Required","Escalated","Resolved"].map((c,i)=>`<div class="col"><b>${c}</b>${["Drainage clash Level 2","Crane permit delay","RFI 118 unanswered","Atlas redesign","Survey error corrected"].filter((_,j)=>j%5==i||(i==0&&j==1)).map(t=>`<div class="t">${t}</div>`).join("")}</div>`).join("")}</div>`;
function rl(a){return a.length?a.map(r=>`<div class="rr" data-r="${r[0]}" style="padding:7px 0;border-bottom:1px solid var(--bd);cursor:pointer"><b>${r[0]}</b> ${r[1]}<br><span class="note">Score ${r[2]*r[3]} · Owner ${r[4]} · </span>${pill(r[5]=="Mitigating"?"Medium":r[5]=="Open"?"Open":"Under Review")}</div>`).join(""):"<div class='note'>No risks in this cell.</div>"}
V.cost=()=>`<h1>Cost & Budget Control</h1><div class="sub">Portfolio earned value · $ millions</div>${kpis([["Original Budget","$46.8M"],["Current Budget","$48.6M","+$1.8M"],["Actual Cost","$34.2M"],["Committed","$9.7M"],["Forecast at Completion","$49.9M","-$1.3M"],["Remaining","$14.4M"]])}<div class="grid g2" style="margin-top:14px"><div class="card"><h3>Earned value</h3>${table(["Metric","Value"],[["Planned Value (PV)","$36.9M"],["Earned Value (EV)","$34.8M"],["Actual Cost (AC)","$34.2M"],["CPI (EV/AC)","1.02"],["SPI (EV/PV)","0.94"],["EAC","$47.7M"]])}</div><div class="card"><h3>Budget allocation</h3>${[["Construction",34],["Materials",22],["Labor",17],["Design & Engineering",11],["Equipment",8],["Project Management",4],["Contingency",4]].map(([n,v])=>`<div style="margin:6px 0">${n} <b>${v}%</b>${bar(v*2.5)}</div>`).join("")}</div><div class="card"><h3>Cumulative spend (% of budget): budget vs actual</h3>${line([[10,22,36,50,62,74,85],[9,21,33,46,60,70,76]],["Budget","Actual"])}<div class="note">Forecast at completion trending $1.3M over approved budget.</div></div></div><h3 style="margin:16px 0 8px">Cost tracking</h3>${table(["Code","Category","Budget","Actual","Committed","Forecast","Variance","Status"],[["01-100","Design & Engineering","$5.3M","$4.9M","$0.2M","$5.2M","+$0.1M","On Track"],["02-200","Construction","$16.5M","$12.1M","$3.4M","$17.4M","-$0.9M","At Risk"],["03-300","Materials","$10.7M","$8.4M","$1.9M","$10.9M","-$0.2M","At Risk"],["04-400","Equipment","$3.9M","$3.0M","$0.5M","$3.8M","+$0.1M","On Track"],["05-900","Contingency","$1.9M","$0.4M","$0","$1.9M","$0","On Track"]])}`;
